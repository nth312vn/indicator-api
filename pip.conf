[global]
# ==============================================================================
# Cấu hình pip Proxy & Repository Index
# ==============================================================================

# 1. Nếu sử dụng HTTP/HTTPS Proxy ra ngoài Internet:
# (Bỏ comment dòng bên dưới và điền host:port proxy của bạn)
# proxy = http://proxy_host:proxy_port
# Ví dụ có user/pass: http://user:password@proxy.company.com:8080

# 2. Nếu sử dụng PyPI Mirror nội bộ (Nexus, Artifactory, DevPI):
# (Bỏ comment và thay đổi URL index nội bộ)
# index-url = http://nexus.internal.domain/repository/pypi-all/simple
# extra-index-url = https://pypi.org/simple
# trusted-host = nexus.internal.domain
#                pypi.org
#                files.pythonhosted.org

# 3. Timeout và số lần thử lại (giúp ổn định khi tải qua proxy)
timeout = 60
retries = 5

[install]
# Tự động tin cậy các host phổ biến phòng trường hợp proxy can thiệp SSL
trusted-host = pypi.org
               files.pythonhosted.org
               pypi.python.org
